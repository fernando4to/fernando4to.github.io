<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada</title>
<link rel="stylesheet" href="/assets/css/base.css">

<!-- Favicon: SVG para navegadores modernos, .ico para los que piden
     /favicon.ico por defecto, y apple-touch-icon para "Añadir a inicio"
     en iOS. Los tres dibujan la misma marca: la barra azul del sitio. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>

<body>
<main class="wrap tarjeta-neutra">
  <div class="barra-marca" aria-hidden="true"></div>
  <h1 class="nombre">Página no encontrada</h1>
  <p class="lema">
    El link que abriste no existe o cambió de dirección.
  </p>
  <p class="bloque-cta">
    <a href="/">Ir al inicio</a>
  </p>
</main>
</body>
</html>
