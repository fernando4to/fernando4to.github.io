<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>og:image 1200×630 — María Pinto</title>
<!--
  FUENTE DE IMAGEN de la vista previa que muestra WhatsApp al compartir
  el link de /mariapinto/.

  ¿Por qué no es un recorte literal de la tarjeta 1080×1350?
  Porque la tarjeta es vertical y el og:image es horizontal (1200×630,
  el estándar que esperan WhatsApp, LinkedIn y Facebook). Recortar una
  franja horizontal del centro dejaría fuera el nombre o el número de
  WhatsApp. Así que son los MISMOS elementos y los mismos textos de la
  tarjeta, reordenados para el formato horizontal.

  Cómo se regenera:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars \
      --allow-file-access-from-files \
      --force-device-scale-factor=1 --window-size=1200,630 \
      --screenshot=/tmp/og.png "_fuente-img/og-mariapinto.html"
-->
<style>
  @font-face {
    font-family: "Source Sans 3";
    font-style: normal;
    font-weight: 400 700;
    src: url("../assets/fonts/source-sans-3-latin.woff2") format("woff2");
  }

  html, body { margin: 0; padding: 0; background: #051C2C; }

  .og {
    width: 1200px;
    height: 630px;
    box-sizing: border-box;
    background: #051C2C;
    font-family: "Source Sans 3", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 52px 72px;
    gap: 30px;
  }

  .barra { width: 100px; height: 12px; background: #2251FF; }

  .nombre { font-size: 76px; font-weight: 700; color: #FFFFFF; line-height: 1.04; }

  .bloque { display: flex; flex-direction: column; gap: 14px; align-items: center; }

  .lema    { font-size: 50px; font-weight: 700; color: #FFFFFF; line-height: 1.1;  white-space: nowrap; }
  .detalle { font-size: 33px; font-weight: 600; color: #FFFFFF; line-height: 1.25; white-space: nowrap; }
  .credenciales {
    font-size: 27px; font-weight: 600; color: #9AA6B2;
    line-height: 1.25; white-space: nowrap;
  }

  .cta {
    background: #2251FF;
    color: #FFFFFF;
    font-size: 38px;
    font-weight: 700;
    line-height: 1;
    padding: 22px 32px;
    white-space: nowrap;
  }
</style>
</head>

<body>
<div class="og">
  <div class="barra"></div>
  <div class="nombre">FERNANDO QUEVEDO</div>
  <div class="bloque">
    <div class="lema">Finanzas, inversiones e IA</div>
    <div class="detalle">Empresas y sector público · Foco en el agro · María Pinto</div>
    <div class="credenciales">Economista PUC · MBA Ejecutivo IAE BS</div>
  </div>
  <div class="cta">WhatsApp +56 9 6778 9324</div>
</div>
</body>
</html>
