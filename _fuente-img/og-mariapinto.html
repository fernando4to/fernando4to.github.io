<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>og:image 1200×630 — María Pinto</title>
<!--
  FUENTE DE IMAGEN de la vista previa que muestra WhatsApp al compartir
  el link de /mariapinto/.

  POR QUÉ SOLO DOS NIVELES DE TEXTO
  La versión anterior tenía cinco (nombre, lema, audiencia, credenciales
  y un botón pintado con el número de WhatsApp). En pruebas reales la
  preview de WhatsApp mide unos 6 cm de ancho en un celular: a ese
  tamaño solo sobrevivían los dos primeros niveles. Los otros tres se
  volvían manchas grises.

  El trabajo que hacían esos tres niveles no se perdió: lo hacen ahora
  el og:title y la og:description, que WhatsApp dibuja en texto del
  sistema —siempre nítido, escalable y accesible— justo debajo de esta
  imagen. La imagen se queda con lo que solo ella puede hacer: gritar
  el nombre y el lugar.

  GEOMETRÍA (medida, no estimada)
  Lienzo 1200×630 con 10% de margen de seguridad = 960×504 px útiles.
  Source Sans 3 tiene una altura de mayúscula de 0,652 × font-size.
    - "FERNANDO QUEVEDO" en UNA línea solo llegaría a 66 px de altura
      de mayúscula: por eso va partido en dos. A dos líneas alcanza
      124 px.
    - La línea 2 debe caber en 960 px de ancho a 70-80 px de altura de
      mayúscula. El lema completo ("Finanzas, inversiones e IA · María
      Pinto") solo llegaría a 37 px, así que no cabe: se cortó a
      "María Pinto", que es el gancho del segmento y llega a 74 px.

  Cómo se regenera (desde la raíz del repo):
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars \
      --allow-file-access-from-files --force-device-scale-factor=1 \
      --window-size=1200,630 --virtual-time-budget=8000 \
      --screenshot=/tmp/og.png "_fuente-img/og-mariapinto.html"
  y luego a JPEG calidad 85 (baseline, nunca progresivo: WhatsApp no
  dibuja los JPEG progresivos):
    python3 -c "from PIL import Image; \
      Image.open('/tmp/og.png').convert('RGB').save(\
      'assets/img/og-mariapinto.jpg', 'JPEG', quality=85, optimize=True)"
-->
<style>
  @font-face {
    font-family: "Source Sans 3";
    font-style: normal;
    font-weight: 400 700;
    src: url("../assets/fonts/source-sans-3-latin.woff2") format("woff2");
  }

  html, body { margin: 0; padding: 0; background: #051C2C; }

  .og {
    width: 1200px;
    height: 630px;
    box-sizing: border-box;
    background: #051C2C;             /* --c-deep */
    font-family: "Source Sans 3", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 63px 120px;             /* margen de seguridad: 10% */
  }

  .barra { width: 100px; height: 12px; background: #2251FF; /* --c-accent */
           margin-bottom: 30px; }

  /* 190px × 0,652 = 124 px de altura de mayúscula (rango pedido: 120-130).
     line-height en px, no en múltiplos: las mayúsculas no tienen
     descendentes, así que se pueden apretar sin que se toquen. */
  .nombre { font-size: 190px; font-weight: 700; line-height: 155px;
            color: #FFFFFF; margin-bottom: 36px; }

  /* 112px × 0,652 = 73 px de altura de mayúscula (rango pedido: 70-80). */
  .lema   { font-size: 112px; font-weight: 400; line-height: 112px;
            color: #FFFFFF; }
</style>
</head>

<body>
<div class="og">
  <div class="barra"></div>
  <div class="nombre">FERNANDO<br>QUEVEDO</div>
  <div class="lema">María Pinto</div>
</div>
</body>
</html>
